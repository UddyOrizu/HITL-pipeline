# Local stack: Postgres + TimescaleDB, Redis, MinIO, LibreOffice worker, ClamAV, Mailpit (catches email),
# API (serves the web app) and worker.
# Usage (from the repo root):  docker compose -f infra/docker-compose.yml up --build
# Hosted MCP server too:       POR_MCP_API_KEY=por_... docker compose -f infra/docker-compose.yml --profile mcp up
name: proof-of-review

x-app-env: &app-env
  POR_ENV: dev
  POR_DATABASE_URL: postgresql+psycopg://por:por@postgres:5432/por
  POR_SECRET_KEY: ${POR_SECRET_KEY:-dev-only-insecure-secret-change-me-in-production}
  POR_PUBLIC_BASE_URL: http://localhost:8000
  POR_INLINE_JOBS: "false"
  POR_REDIS_URL: redis://redis:6379/0
  POR_S3_ENDPOINT: http://minio:9000
  POR_S3_BUCKET: por-files
  POR_S3_ACCESS_KEY: por
  POR_S3_SECRET_KEY: por-minio-secret
  POR_LIBREOFFICE_URL: http://libreoffice:8100
  POR_CLAMAV_HOST: clamav
  POR_SMTP_HOST: mailpit
  POR_SMTP_PORT: "1025"
  POR_SMTP_STARTTLS: "false"
  POR_CORS_ORIGINS: ${POR_CORS_ORIGINS:-}
  POR_BOOTSTRAP_ADMIN_EMAIL: ${POR_BOOTSTRAP_ADMIN_EMAIL:-}
  POR_BOOTSTRAP_ADMIN_PASSWORD: ${POR_BOOTSTRAP_ADMIN_PASSWORD:-}
  POR_MODEL_PROVIDER: ${POR_MODEL_PROVIDER:-heuristic}
  POR_MODEL_ID: ${POR_MODEL_ID:-claude-sonnet-5-5}
  POR_MODEL_API_KEY: ${POR_MODEL_API_KEY:-}

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: por
      POSTGRES_PASSWORD: por
      POSTGRES_DB: por
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U por -d por"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: por
      MINIO_ROOT_PASSWORD: por-minio-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]

  libreoffice:
    build: ./libreoffice
    ports: ["8100:8100"]

  clamav:
    image: clamav/clamav:stable
    ports: ["3310:3310"]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      retries: 20
      start_period: 120s  # the first virus database download takes a while

  mailpit:
    image: axllent/mailpit:v1.21
    ports: ["8025:8025", "1025:1025"]  # web inbox on http://localhost:8025

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    environment: *app-env
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
      minio: {condition: service_started}
      clamav: {condition: service_healthy}

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["python", "-m", "services.worker"]
    environment: *app-env
    depends_on: [api]

  mcp:
    profiles: [mcp]
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["python", "-m", "mcp_server.server", "--http"]
    environment:
      POR_MCP_API_URL: http://api:8000
      POR_MCP_API_KEY: ${POR_MCP_API_KEY:?set POR_MCP_API_KEY to a source app key}
      POR_MCP_PORT: "8000"
      POR_MCP_HOST: 0.0.0.0
    ports: ["8001:8000"]
    depends_on: [api]

volumes:
  pgdata:
  minio:
